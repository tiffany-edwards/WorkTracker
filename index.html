<!DOCTYPE html>
<html lang="en" data-scribe-recorder-ready="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work Tracker</title>
<style>
:root{--pur:#7b4fd6;--teal:#12857f;--bg:#f6f6f3;--card:#fff;--fg:#1d1d1b;--mut:#6b6b66;--bd:#e2e2dc;--acc:#2f6fed;--ok:#1f8a4c;--warn:#c27a00;--bad:#c93a3a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pur:#a98bff;--teal:#3cc2b9;--bg:#171716;--card:#222221;--fg:#ecece8;--mut:#9a9a94;--bd:#363634;--acc:#6e9bff;--ok:#4cc27d;--warn:#e5a53a;--bad:#ef6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--pur:#a98bff;--teal:#3cc2b9;--bg:#171716;--card:#222221;--fg:#ecece8;--mut:#9a9a94;--bd:#363634;--acc:#6e9bff;--ok:#4cc27d;--warn:#e5a53a;--bad:#ef6b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--bd);margin-bottom:14px}
nav button{background:none;border:0;color:var(--mut);padding:8px 12px;font:inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--fg);border-color:var(--acc);font-weight:600}
button,input,select,textarea{font:inherit;color:var(--fg)}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.d{color:var(--bad)}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar input[type=search]{flex:1;min-width:140px}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;overflow:hidden}
.head{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;flex-wrap:wrap}
.head .t{flex:1;min-width:140px;font-weight:600}
.ref{color:var(--acc);font-weight:700;margin-right:6px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mut);white-space:nowrap}
.pill.hi{color:var(--bad);border-color:var(--bad)}.pill.Done{color:var(--ok);border-color:var(--ok)}.pill.Blocked{color:var(--bad);border-color:var(--bad)}.pill.od{color:var(--bad);border-color:var(--bad)}
.prog{width:70px;height:6px;background:var(--bd);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc)}
.pill.Open,.pill.Scheduled{color:var(--acc);border-color:var(--acc)}
.pill.progress,.pill.Doing{color:var(--warn);border-color:var(--warn)}
.pill.do,.pill.Cancelled{color:var(--mut)}
.pill.Cancelled{text-decoration:line-through}
.pill.Open,.pill.Scheduled,.pill.progress,.pill.Doing,.pill.do,.pill.Cancelled,.pill.Done,.pill.Blocked,.pill.hi,.pill.od{background:color-mix(in srgb,currentColor 13%,transparent);font-weight:600}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre;overflow:auto}
.outl{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-top:2px}
.ol{display:flex;gap:6px;padding:1px 0}.bl{color:var(--mut)}
.pill.c-gray{color:var(--mut)}.pill.c-blue{color:var(--acc);border-color:var(--acc)}.pill.c-amber{color:var(--warn);border-color:var(--warn)}.pill.c-red{color:var(--bad);border-color:var(--bad)}.pill.c-green{color:var(--ok);border-color:var(--ok)}.pill.c-purple{color:var(--pur);border-color:var(--pur)}.pill.c-teal{color:var(--teal);border-color:var(--teal)}
.pill.c-gray,.pill.c-blue,.pill.c-amber,.pill.c-red,.pill.c-green,.pill.c-purple,.pill.c-teal{background:color-mix(in srgb,currentColor 13%,transparent);font-weight:600}
.hl{outline:2px solid var(--acc)}
.mini[data-act="goto"]:hover{background:color-mix(in srgb,var(--acc) 8%,transparent)}
.pill.pb0{color:var(--mut)}.pill.pb1{color:var(--warn);border-color:var(--warn)}.pill.pb2{color:var(--ok);border-color:var(--ok)}.pill.pb3{color:var(--acc);border-color:var(--acc)}.pill.pb4{color:var(--bad);border-color:var(--bad)}
.pill.pb0,.pill.pb1,.pill.pb2,.pill.pb3,.pill.pb4{background:color-mix(in srgb,currentColor 13%,transparent);font-weight:600;cursor:pointer}
.pill.tg{color:var(--acc);border-color:var(--acc);cursor:pointer}
.body{padding:4px 12px 12px;border-top:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
.note{border-left:3px solid var(--bd);padding:2px 10px;margin:6px 0;display:flex;gap:8px;justify-content:space-between}
.note small{color:var(--mut);display:block}.note span{white-space:pre-wrap}
.note button{background:none;border:0;color:var(--mut);cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}.stat b{font-size:24px;display:block}.stat span{color:var(--mut);font-size:13px}
h2{font-size:15px;margin:18px 0 8px}
.empty{color:var(--mut);padding:8px 2px}
.mini{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.mini .t{flex:1}
textarea{min-height:60px;resize:vertical}

.stat{cursor:pointer;transition:border-color .12s,transform .12s}
.stat:hover{border-color:var(--acc);transform:translateY(-1px)}
.stat.lnk b{color:var(--acc)}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-4px 0 12px}
.fbar select,.fbar input{width:auto}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);cursor:pointer}
.tb{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0}
.tb button{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--mut)}
.tb button:hover{color:var(--fg);border-color:var(--acc)}
textarea.rt{min-height:80px}
.rtx a,.outl a{color:var(--acc)}
.ol code{background:var(--bd);border-radius:4px;padding:0 4px;font-family:ui-monospace,Menlo,Consolas,monospace}
.ol .bl{min-width:14px}
.wk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.sec h3{font-size:14px;margin:0 0 4px}
.si{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--bd)}
.si:last-of-type{border-bottom:0}
.si input[type=checkbox]{width:auto;margin-top:4px}
.si .t{flex:1}
.si small{color:var(--mut);display:block}
.pv{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;white-space:pre-wrap;font-size:13px;max-height:420px;overflow:auto}

/* ===================== v7 visual refresh ===================== */
:root{--r:14px;--sh:0 1px 2px rgba(20,20,25,.05),0 10px 26px -18px rgba(20,20,25,.35);--sh2:0 2px 6px rgba(20,20,25,.08),0 18px 40px -22px rgba(20,20,25,.45);--side:#fbfbf9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 2px 10px rgba(0,0,0,.5);--side:#1b1b1a}}
:root[data-theme="dark"]{--sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 2px 10px rgba(0,0,0,.5);--side:#1b1b1a}
body{font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:1200px;margin:0 auto}
.side{padding:14px 14px 8px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;margin-bottom:12px}
.brand .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--pur));box-shadow:0 4px 12px -4px color-mix(in srgb,var(--acc) 70%,transparent)}
.sideft{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.btn.w{width:100%;text-align:left}
.main{padding:14px 16px 28px;min-width:0}
.top{margin-bottom:14px}
.top h1{font-size:22px;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:12.5px;margin-top:2px}
nav{gap:2px;margin-bottom:16px}
nav button{border-radius:9px;padding:8px 12px;transition:background .12s,color .12s}
nav button:hover{color:var(--fg);background:color-mix(in srgb,var(--fg) 6%,transparent)}
@media (min-width:1000px){
 .app{display:grid;grid-template-columns:234px minmax(0,1fr);align-items:start}
 .side{position:sticky;top:0;align-self:start;min-height:100vh;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column}
 .side nav{flex-direction:column;border-bottom:0;overflow:visible;margin-bottom:0;flex:1}
 .side nav button{width:100%;text-align:left;border-bottom:0;font-weight:500}
 .side nav button.on{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc);border-color:transparent}
 .main{padding:22px 26px 40px}
}
@media (max-width:999px){.side{display:flex;flex-direction:column;border-bottom:1px solid var(--bd)}.side .sideft{flex-direction:row;flex-wrap:wrap}.btn.w{width:auto}.side nav{order:3}}
.btn{border-radius:9px;transition:border-color .12s,background .12s,transform .08s;font-weight:500}
.btn:hover{border-color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn.p{box-shadow:0 4px 14px -6px color-mix(in srgb,var(--acc) 80%,transparent)}
.btn.p:hover{filter:brightness(1.06)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid color-mix(in srgb,var(--acc) 50%,transparent);outline-offset:1px;border-color:var(--acc)}
.card{border-radius:var(--r);box-shadow:var(--sh);border-left:3px solid transparent;transition:box-shadow .14s,border-color .14s,transform .1s}
.card:hover{box-shadow:var(--sh2)}
.card.op{box-shadow:var(--sh2)}
.card.ac-blue{border-left-color:var(--acc)}.card.ac-amber{border-left-color:var(--warn)}.card.ac-red{border-left-color:var(--bad)}.card.ac-green{border-left-color:var(--ok)}.card.ac-purple{border-left-color:var(--pur)}.card.ac-teal{border-left-color:var(--teal)}.card.ac-gray{border-left-color:var(--bd)}
.head{padding:11px 14px}
.head .t{letter-spacing:-.01em}
.body{padding:6px 14px 14px}
h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2 .n{background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--mut);border-radius:99px;padding:1px 7px;font-size:11px;letter-spacing:0}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.stat{border-radius:var(--r);padding:14px 14px 12px;background:linear-gradient(140deg,color-mix(in srgb,var(--tc) 20%,var(--card)) 0%,var(--card) 70%);border-color:color-mix(in srgb,var(--tc) 32%,var(--bd));box-shadow:var(--sh)}
.stat b{font-size:28px;letter-spacing:-.03em;line-height:1.1}
.stat.lnk b{color:var(--tc)}
.stat:hover{border-color:var(--tc);box-shadow:var(--sh2)}
.stat span{font-size:12.5px}
.mini{padding:8px 2px;border-radius:8px;transition:background .12s}
.mini:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.pill{font-size:11.5px;padding:2.5px 9px;line-height:1.5}
.pill.cam{color:var(--cc);border-color:color-mix(in srgb,var(--cc) 45%,var(--bd));background:color-mix(in srgb,var(--cc) 15%,transparent);font-weight:700;letter-spacing:.02em}
.camwrap{display:flex;gap:6px;flex-wrap:wrap;padding-top:2px}
.camchip{font:inherit;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:99px;cursor:pointer;background:var(--bg);border:1px solid var(--bd);color:var(--mut);transition:all .12s;width:auto}
.camchip:hover{border-color:var(--cc);color:var(--cc)}
.camchip.on{color:var(--cc);border-color:color-mix(in srgb,var(--cc) 60%,transparent);background:color-mix(in srgb,var(--cc) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 30%,transparent)}
.ref{letter-spacing:.01em}
.sec{border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.sec h3{font-size:14.5px;letter-spacing:-.01em;margin-bottom:6px}
.fbar{padding:8px 10px;background:var(--card);border:1px solid var(--bd);border-radius:11px;box-shadow:var(--sh);margin:0 0 12px}
.fbar select,.fbar input{padding:4px 8px;border-radius:8px;font-size:13.5px}
.bar{align-items:center}
.pv{border-radius:10px}
.tb button{border-radius:7px}
.banner{border-radius:12px;box-shadow:var(--sh);border-left:3px solid var(--acc)}
.note{border-left-width:3px;border-radius:0 8px 8px 0;background:color-mix(in srgb,var(--fg) 3%,transparent);padding:6px 10px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--fg) 18%,transparent);border-radius:8px;border:3px solid var(--bg)}
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="brand">
      <div class="mark">WT</div>
      <span>Work Tracker</span>
    </div>
    <nav id="nav">
      <button data-tab="dashboard" class="on">Dashboard</button>
      <button data-tab="tickets">Tickets</button>
      <button data-tab="tasks">Tasks</button>
      <button data-tab="meetings">Meetings</button>
      <button data-tab="playbook">Playbook</button>
      <button data-tab="weekly">Weekly summary</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <div class="sideft">
      <button class="btn w" id="downloadAppBtn">Download app (.html)</button>
      <button class="btn w" id="themeBtn">Theme: Auto</button>
      <button class="btn w d" id="resetDataBtn">Reset data</button>
    </div>
  </div>
  <div class="main" id="mainContent">
    <!-- App content renders here -->
  </div>
</div>
<script>
  // Script logic goes here based on state management and rendering handlers
</script>
</body>
</html>
